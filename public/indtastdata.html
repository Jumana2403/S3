<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indtast data - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
  <script src="indtastdata.js" defer></script>
</head>
<body>
  <main class="kort">
    <h1>Registrer blodsukker</h1>
    <p>Her kan du indtaste din blodsukkermåling.</p>

    <section class="maaleplan" aria-labelledby="dagens-plan">
      <h2 id="dagens-plan">Din måleplan</h2>
      <p>Demo: syntetisk patient-ID 1. Login er en mockup.</p>
      <label for="maaleplan-id">Vælg planlagt måletid</label>
      <select id="maaleplan-id" name="maaleplan_id" disabled>
        <option value="">Henter måletider …</option>
      </select>
      <p>Status: <span class="status status-planlagt" id="maale-status">Henter …</span></p>
    </section>

    <form id="maaling-form">
      <h2>Indtast den planlagte måling</h2>

      <div class="form-field">
        <label for="blodsukker">Blodsukker i mmol/L</label>
        <input id="blodsukker" type="number" min="0" step="0.1" inputmode="decimal" placeholder="fx 6.8" required>
      </div>

      <div class="form-field">
        <label for="maalt-tid">Hvornår målte du dit blodsukker?</label>
        <input id="maalt-tid" name="maalt_tid" type="datetime-local" required>
      </div>

      <button type="submit" class="button-primary" disabled>Registrer måling</button>
      <p id="maaling-besked" role="status"></p>
    </form>

    <p><a class="button" href="#dagens-plan">Se din måleplan</a></p>
  </main>
</body>
</html>
