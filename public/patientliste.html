<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patientliste - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
  <script src="patientliste.js" defer></script>
</head>
<body>
  <main class="kort patientoversigt">
    <header>
      <h1>Patientliste</h1>
      <p>Vælg en patient for at se måleplan og registrerede blodsukkermålinger.</p>
      <p>Patientoplysningerne hentes fra serveren. Data i projektet er syntetiske.</p>
    </header>

    <section>
      <h2>Patienternes måleforløb</h2>
      <p id="liste-besked">Henter patienter …</p>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Patient-ID</th>
              <th>Navn</th>
              <th>Handling</th>
            </tr>
          </thead>
          <tbody id="patienter"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p><a class="button button-primary" href="login.html">Tilbage til login</a></p>
    </footer>
  </main>


</body>
</html>
