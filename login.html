<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log ind - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body class="login-side">
  <main class="kort">
    <div class="login-overskrift">
      <h1 class="login-titel">Log ind</h1>
      <img class="login-logo" src="images/Billede.png" alt="Dråberr">
    </div>
    <p>Diabetesmåleforløb</p>
    <p>Log ind i din måleplan og dine registrerede blodsukkermålinger.</p>

   
    <h2>Vælg din rolle</h2>
    <button id="patient-knap" type="button">Patient</button>
    <button id="personale-knap" type="button">Sundhedspersonale</button>
    <p id="rolle-besked">Vælg en rolle, før du logger ind.</p>

    
    <form id="login-form">
      <div class="form-field">
        <label for="brugernavn">Brugernavn</label>
        <input id="brugernavn" type="text" required>
      </div>
      <div class="form-field">
        <label for="adgangskode">Adgangskode</label>
        <input id="adgangskode" type="password" required>
      </div>
      <button type="submit" class="button-primary">Log ind</button>
      <p id="besked"></p>
    </form>
    <p><a href="index.html">Tilbage til forsiden</a></p>
  </main>
</body>
</html>
