<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="kort">
    <h1>Log ind</h1>
    <p>Vælg en persona til den klikbare mockup.</p>

    <form id="login-form">
      <div class="form-field">
        <label for="persona">Persona</label>
        <select id="persona" required>
          <option value="amina">Amina Karlsen - patient</option>
          <option value="jonas">Jonas Mikkelsen - patient</option>
          <option value="sara">Sara Nielsen - sundhedspersonale</option>
        </select>
      </div>

      <button type="submit" class="button-primary">Fortsæt</button>
      <p id="login-besked" role="status"></p>
    </form>
  </main>
</body>
</html>
