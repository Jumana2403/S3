<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patientliste - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kort patientoversigt">
    <nav aria-label="Navigation i mockup">
      <p>
        <a class="button" href="login.html">Login</a>
        <a class="button" href="patientliste.html" aria-current="page">Patientliste</a>
        <a class="button" href="indtastdata.html?patient=amina">Indtast data</a>
      </p>
    </nav>

    <h1>Patientliste</h1>
    <p>Sundhedspersonale kan vælge en patient og se patientens registreringsside.</p>

    <div class="table-scroll">
      <table>
        <caption>Patienter i mockuppet</caption>
        <thead>
          <tr>
            <th>Navn</th>
            <th>Måleplan</th>
            <th>Status</th>
            <th>Handling</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Amina Karlsen</td>
            <td>Morgen, middag og aften</td>
            <td><span class="status status-mangler">Mangler 2</span></td>
            <td><a class="button" href="indtastdata.html?patient=amina">Åbn Amina</a></td>
          </tr>
          <tr>
            <td>Jonas Mikkelsen</td>
            <td>Morgen og aften</td>
            <td><span class="status status-planlagt">Planlagt</span></td>
            <td><a class="button" href="indtastdata.html?patient=jonas">Åbn Jonas</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
