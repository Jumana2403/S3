<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indtast data - Diabetesmåleforløb</title>
  <link rel="stylesheet" href="style.css">
  <script src="indtastdata.js" defer></script>
</head>
<body>
  <main class="kort">
    <h1>Registrer Blodsukker</h1>
    <p>Her Kan Du Indtaste Din Blodsukkermåling.</p>

    <section class="maaleplan" aria-labelledby="dagens-plan">
      <h2 id="dagens-plan">Din måleplan</h2>
      <p>Planlagt måling: <strong>5. oktober 2026 kl. 09.00</strong></p>
      <p>Status: <span class="status status-planlagt" id="maale-status">Planlagt</span></p>
    </section>

    <form id="maaling-form">
      <h2>Indtast den planlagte måling</h2>

      <div class="form-field">
        <label for="blodsukker">Blodsukker i mmol/L</label>
        <input id="blodsukker" type="number" min="0" step="0.1" inputmode="decimal" placeholder="fx 6.8" required>
      </div>

      <button type="submit" class="button-primary">Registrer måling</button>
      <p id="maaling-besked" role="status"></p>
    </form>

    <p><a class="button" href="login.html">Tilbage til login</a></p>
  </main>
</body>
</html>
